[project]
name = "video-archiver"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    # To process downloads in parallel
    "aiohttp",
    # To analyze htmls
    "beautifulsoup4",
    # To convert json to model
    "dataclasses-json",
    # To download video
    "ffmpeg-python",
    # To read yaml file as config
    "lazy-object-proxy",
    # To exclude unknown fields when converting json to model
    "marshmallow",
    # To analyze m3u8 file
    "m3u8",
    # To process images to remove small images like Emoji and thumbnail
    "pillow",
    # To add / subtract dates
    "python-dateutil",
    # To read yaml file as config
    "pyyaml",
    # Official doc recomends to use
    # @see https://docs.python.org/ja/3/library/urllib.request.html
    "requests",
    # To read yaml file as config
    "yamldataclassconfig",
]

[dependency-groups]
dev = [
    "black",
    "coverage",
    "flake8",
    # To use flake8 --radon-show-closures
    "flake8-polyfill",
    "invoke",
    "isort",
    "mypy",
    "parameterized",
    "pylint",
    "pytest",
    "pytest-mock",
    "radon",
    "requests-mock",
    "xenon",
]

[tool.uv]
# This project is an application, not a distributable package
package = false

[tool.isort]
# @see https://github.com/timothycrosley/isort/issues/694#issuecomment-581246882
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120

[tool.pylint.basic]
docstring-min-length = "7"

# @see https://black.readthedocs.io/en/stable/pyproject_toml.html#configuration-format
[tool.black]
line-length = 120

[tool.pylint.format]
max-line-length = "120"

[tool.pylint.options]
# Since this rule against single responsibility principle.
# @see https://stackoverflow.com/questions/28722314/why-does-pylint-want-2-public-methods-per-class/40258006#40258006
min-public-methods = "1"
